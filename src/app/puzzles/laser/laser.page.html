<main class="page">
  <a routerLink="/" fragment="spatial-placement" class="back-link">Retour au menu</a>

  <section class="card">
    <header class="header">
      <p class="eyebrow">Réflexion spatiale</p>
      <h1>Laser</h1>
      <p class="instructions">
        Clique sur un miroir pour le faire pivoter avec un ou plusieurs autres miroirs. Guide le
        laser jusqu’à la sortie verte.
      </p>
    </header>

    <div class="game-layout">
      <section class="board-section" aria-label="Boîte à miroirs">
        <div
          class="laser-board"
          [style.--columns]="puzzle().cols"
          [style.--rows]="puzzle().rows"
          [attr.aria-label]="'Grille laser de ' + puzzle().rows + ' par ' + puzzle().cols"
        >
          @for (cell of boardCells(); track cell.row + ':' + cell.col) {
            <div class="board-cell">
              @if (mirrorAt(cell.row, cell.col); as mirror) {
                <button
                  type="button"
                  [class]="
                    'mirror orientation-' +
                    mirror.orientation +
                    (controlLocked(mirror.id) ? ' hinted' : '')
                  "
                  [disabled]="isSolved() || controlLocked(mirror.id)"
                  (click)="clickMirror(mirror.id)"
                  [attr.aria-label]="'Miroir orienté à ' + mirrorOrientationLabel(mirror.orientation)"
                >
                  <span aria-hidden="true"></span>
                </button>
              }
            </div>
          }

          <svg
            class="laser-svg"
            [attr.viewBox]="'0 0 ' + puzzle().cols + ' ' + puzzle().rows"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            @for (segment of trace().segments; track $index) {
              <line
                class="laser-segment"
                [attr.x1]="segment.x1"
                [attr.y1]="segment.y1"
                [attr.x2]="segment.x2"
                [attr.y2]="segment.y2"
              />
            }
          </svg>

          <span
            class="laser-start"
            [style.top]="(puzzle().startRow + 0.5) / puzzle().rows * 100 + '%'"
            aria-label="Départ du laser"
          ></span>
          <span
            class="laser-target"
            [class.reached]="isSolved()"
            [style.top]="(puzzle().targetRow + 0.5) / puzzle().rows * 100 + '%'"
            aria-label="Cible du laser"
          ></span>
        </div>
      </section>

    </div>

    <section class="button-controls" aria-label="Actions du jeu">
      <div class="actions" aria-label="Actions du jeu">
        <button
          type="button"
          class="secondary-button"
          [disabled]="isSolved() || allControlsLocked()"
          (click)="useHint()"
        >
          Indice
        </button>
        <button type="button" (click)="newPuzzle()">Nouveau laser</button>
      </div>
    </section>
  </section>

  @if (isSolved()) {
    <app-puzzle-success-popup
      title="Laser réussi !"
      message="Le rayon a atteint la sortie verte."
      actionLabel="Nouveau laser"
      (action)="newPuzzle()"
    />
  }
</main>
