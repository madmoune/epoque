<main class="page">
  <a routerLink="/" fragment="enigmes" class="back-link">Retour au menu</a>

  <section class="card">
    <p class="eyebrow">Énigme</p>
    <h1>Navigation</h1>
    <app-puzzle-answer
      [answer]="answer"
      [partials]="partials"
      (correctAnswer)="markSolved()"
    ></app-puzzle-answer>
    <section class="puzzle-panel" aria-label="Énoncé du puzzle">
      <p class="clue">{{ flavorText() }}</p>

      <img class="navigation-image" src="puzzles/navigation.png" alt="Illustration de navigation pour l'énigme" />
    </section>
  </section>
</main>
